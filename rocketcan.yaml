sid:
  fields:
    - name: prio
      index: 1
      bits: 2
      enum: prio
    # Uses 'messages', which is separate from the rest of enums
    - name: message_type
      index: 2
      bits: 7
    - name: board_type
      index: 3
      bits: 6
      enum: board_type
    - name: board_inst
      index: 4
      bits: 6
      enum: board_inst
    # Uses 'message.metadata', an arbitrary extra byte of data for every message
    - name: metadata
      index: 5
      bits: 8

message_fields:
  - id: timestamp
    name: TIMESTAMP
    desc: Message timestamp in milliseconds
    bytes: 2
    type: uint
    unit: ms

messages:
  - name: UNDEFINED
    desc: Undefined message, do not use
    id: 0x000
    metadata: null
    field:
      - ref: timestamp
        index: 1

  - name: GENERAL_BOARD_STATUS
    desc: Board status broadcast
    id: 0x001
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: BOARD_ERROR_BITFIELD
        index: 2
        desc: Board error code bitfield
        bytes: 4
        type: bitfield
        bitfield: board_error_bitfield

  - name: RESET_CMD
    desc: Command to reset boards
    id: 0x002
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: TARGET_BOARD_TYPE_ID
        index: 2
        desc: Board Type ID of board to reset, set to 0 to reset all boards on bus
        bytes: 1
        type: enum
        enum: board_type
      - name: TARGET_BOARD_INST_ID
        index: 3
        desc: Board Inst ID of board to reset, set to 0 to reset all board of specific type
        bytes: 1
        type: enum
        enum: board_inst

  - name: DEBUG_RAW
    desc: 6-bytes of raw data
    id: 0x003
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: RAW_DATA
        index: 2
        desc: Raw data, 6 bytes
        bytes: 6
        type: raw

  - name: CONFIG_SET
    desc: Set board specific configuration
    id: 0x004
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: TARGET_BOARD_TYPE_ID
        index: 2
        desc: Board Type ID of target board, cannot be zero
        bytes: 1
        type: enum
        enum: board_type
      - name: TARGET_BOARD_INST_ID
        index: 3
        desc: Board Inst ID of target board, set to 0 to set all board of specific type
        bytes: 1
        type: enum
        enum: board_inst
      - name: CONFIG_ID
        index: 4
        desc: Configuration ID, Board Specific
        bytes: 2
        type: uint
      - name: CONFIG_VALUE
        index: 5
        desc: Configuration Value, Board and Config ID specific
        bytes: 2
        type: uint

  - name: CONFIG_STATUS
    desc: Broadcast board specific configuration, for verify CONFIG_SET success
    id: 0x005
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: CONFIG_ID
        index: 2
        desc: Configuration ID, Board Specific
        bytes: 2
        type: uint
      - name: CONFIG_VALUE
        index: 3
        desc: Configuration Value, Board and Config ID specific
        bytes: 2
        type: uint

  - name: ACTUATOR_CMD
    desc: Set actuator commanded state
    id: 0x006
    metadata:
      - name: ACTUATOR_ID
        desc: Acturator ID
        type: enum
        enum: actuator_id
    field:
      - ref: timestamp
        index: 1
      - name: ACTUATOR_CMD_STATE
        index: 2
        desc: Actuator Commanded State
        bytes: 1
        type: enum
        enum: actuator_state

  - name: ACTUATOR_STATUS
    desc: Actuator Status Message
    id: 0x007
    metadata:
      - name: ACTUATOR_ID
        desc: Acturator ID
        type: enum
        enum: actuator_id
    field:
      - ref: timestamp
        index: 1
      - name: ACTUATOR_CMD_STATE
        index: 2
        desc: Actuator Commanded State
        bytes: 1
        type: enum
        enum: actuator_state
      - name: ACTUATOR_CURR_STATE
        index: 3
        desc: Actuator Current State
        bytes: 1
        type: enum
        enum: actuator_state

  - name: ALT_ARM_CMD
    desc: Command to arm altimeter
    id: 0x008
    metadata:
      - name: ALT_ID
        desc: Altimeter ID
        type: enum
        enum: altimeter_id
    field:
      - ref: timestamp
        index: 1
      - name: ALT_ARM_STATE
        index: 2
        desc: Altimeter set arm state
        bytes: 1
        type: enum
        enum: alt_arm_state

  - name: ALT_ARM_STATUS
    desc: Altimeter Arm Status
    id: 0x009
    metadata:
      - name: ALT_ID
        desc: Altimeter ID
        type: enum
        enum: altimeter_id
    field:
      - ref: timestamp
        index: 1
      - name: ALT_ARM_STATE
        index: 2
        desc: Altimeter current arm state
        bytes: 1
        type: enum
        enum: alt_arm_state
      - name: DROGUE_V
        index: 3
        desc: Drogue Pyro Voltage
        bytes: 2
        type: uint
      - name: MAIN_V
        index: 4
        desc: Main Pyro Voltage
        bytes: 2
        type: uint

  - name: SENSOR_ANALOG16
    desc: 16-bits analog sensor
    id: 0x0A
    metadata:
      - name: SENSOR_ID
        desc: Sensor ID
        type: enum
        enum: analog_sensor_id
    # VALUE fields are sent as uint; offset and scale depend on SENSOR_ID (see cansw_canards can_telemetry_scaling.h)
    field:
      - ref: timestamp
        index: 1
      - name: VALUE
        index: 2
        desc: Analog sensor value
        bytes: 2
        type: uint

  - name: SENSOR_ANALOG32
    desc: 32-bits analog sensor
    id: 0x0B
    metadata:
      - name: SENSOR_ID
        desc: Sensor ID
        type: enum
        enum: analog_sensor_id
    # VALUE fields are sent as uint; offset and scale depend on SENSOR_ID (see cansw_canards can_telemetry_scaling.h)
    field:
      - ref: timestamp
        index: 1
      - name: VALUE
        index: 2
        desc: Analog sensor value
        bytes: 4
        type: uint

  - name: SENSOR_2D_ANALOG24
    desc: 2-Dimensional 24-bit analog sensor value message
    id: 0x0C
    metadata:
      - name: SENSOR_ID
        desc: 2 Dimensional sensor ID
        type: enum
        enum: dem_2d_sensor_id
    # VALUE fields are sent as uint; offset and scale depend on SENSOR_ID (see cansw_canards can_telemetry_scaling.h)
    field:
      - ref: timestamp
        index: 1
      - name: VALUE_X
        index: 2
        desc: Analog sensor value X
        bytes: 3
        type: uint
      - name: VALUE_Y
        index: 3
        desc: Analog sensor value Y
        bytes: 3
        type: uint

  - name: SENSOR_3D_ANALOG16
    desc: 3-Dimensional 16-bit analog sensor value message
    id: 0x0D
    metadata:
      - name: SENSOR_ID
        desc: 3 Dimensional sensor ID
        type: enum
        enum: dem_3d_sensor_id
    # VALUE fields are sent as uint; offset and scale depend on SENSOR_ID (see cansw_canards can_telemetry_scaling.h)
    field:
      - ref: timestamp
        index: 1
      - name: VALUE_X
        index: 2
        desc: Analog sensor value X
        bytes: 2
        type: uint
      - name: VALUE_Y
        index: 3
        desc: Analog sensor value Y
        bytes: 2
        type: uint
      - name: VALUE_Z
        index: 4
        desc: Analog sensor value Z
        bytes: 2
        type: uint

  - name: GPS_TIMESTAMP
    id: 0x0E
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: UTC_HOURS
        index: 2
        desc: Hour
        bytes: 1
        type: uint
      - name: UTC_MINUTES
        index: 3
        desc: Minutes
        bytes: 1
        type: uint
      - name: UTC_SECONDS
        index: 4
        desc: Seconds
        bytes: 1
        type: uint
      - name: UTC_DSECONDS
        index: 5
        desc: Decisecond
        bytes: 1
        type: uint

  - name: GPS_LATITUDE
    id: 0x0F
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: DEGREES
        index: 2
        desc: Degrees
        bytes: 1
        type: uint
      - name: MINUTES
        index: 3
        desc: Minutes
        bytes: 1
        type: uint
      - name: DMINUTES_H
        index: 4
        desc: No description
        bytes: 2
        type: uint
      - name: DIR_NS
        index: 5
        desc: North/South
        bytes: 1
        type: ascii

  - name: GPS_LONGITUDE
    id: 0x10
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: DEGREES
        index: 2
        desc: Degrees
        bytes: 1
        type: uint
      - name: MINUTES
        index: 3
        desc: Minutes
        bytes: 1
        type: uint
      - name: DMINUTES_H
        index: 4
        desc: No description
        bytes: 2
        type: uint
      - name: DIR_EW
        index: 5
        desc: East/West
        bytes: 1
        type: ascii

  - name: GPS_ALTITUDE
    id: 0x11
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: ALT
        index: 2
        desc: Altitude in ft
        bytes: 4
        type: uint
      - name: DALT
        index: 3
        desc: No description
        bytes: 1
        type: uint

  - name: GPS_INFO
    id: 0x12
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: NUM_SAT
        index: 2
        desc: Number of satellite
        bytes: 1
        type: uint
      - name: QUALITY
        index: 3
        desc: Quality
        bytes: 1
        type: uint

  - name: STREAM_STATUS
    id: 0x13
    metadata: null
    field:
      - ref: timestamp
        index: 1
      - name: TOTAL_SIZE
        index: 2
        desc: Total transfer size in bytes
        bytes: 3
        type: uint
      - name: TX_SIZE
        index: 3
        desc: Transfered size in bytes
        bytes: 3
        type: uint

  - name: STREAM_DATA
    id: 0x14
    metadata:
      - name: SEQ_ID
        desc: Sequence ID
        type: uint
    field:
      - ref: timestamp
        index: 1
      - name: DATA
        index: 2
        desc: Data payload
        bytes: 6
        type: raw

  - name: STREAM_RETRY
    id: 0x15
    metadata:
      - name: SEQ_ID
        desc: Sequence ID of data packet need to be resend
        type: uint
    field:
      - ref: timestamp
        index: 1

  - name: TELEMETRY_INFO
    id: 0x16
    metadata:
      - name: CHANNEL_ID
        desc: Channel ID which is the LTT board instance ID
        type: enum
        enum: board_inst
    field:
      - ref: timestamp
        index: 1
      - name: LQI
        index: 2
        desc: Link Quality Indicator
        bytes: 1
        type: uint
      - name: RSSI
        index: 3
        desc: Received Signal Strength Indicator(2s complement signed)
        bytes: 1
        type: int

  - name: TELEMETRY_STATE_SWITCH
    id: 0x17
    metadata:
      - name: CHANNEL_ID
        desc: Channel ID which is the LTT board instance ID
        type: enum
        enum: board_inst
    field:
      - ref: timestamp
        index: 1

  - name: CANARD_FIRMWARE_ERROR
    id: 0x18
    metadata:
      - name: MODULE_ID
        desc: Module ID
        type: enum
        enum: canards_module_id
    field:
      - ref: timestamp
        index: 1
      - name: ERROR_CODE
        index: 2
        desc: Error Code Bitfield
        bytes: 4
        type: bitfield
        bitfield: canards_module_error_bitfield
      - name: SEVERITY
        index: 3
        desc: Severity
        bytes: 1
        type: enum
        enum: canards_health_severity

  - name: LEDS_ON
    id: 0x19
    metadata: null
    field:
      - ref: timestamp
        index: 1

  - name: LEDS_OFF
    id: 0x20
    metadata: null
    field:
      - ref: timestamp
        index: 1

enums:
  - name: prio
    desc: Priority for CAN SID
    prefix: PRIO
    value:
      - name: HIGHEST
        desc: Human-sent commands, valve actuation, canard angle
        number: 0x0
      - name: HIGH
        desc: Ops-critical data
        number: 0x1
      - name: MEDIUM
        desc: Non-ops-critical data
        number: 0x2
      - name: LOW
        desc: For logging only
        number: 0x3
        
  - name: board_type
    desc: Board type ID for CAN SID
    prefix: BOARD_TYPE_ID
    value:
      - name: ANY
        desc: Any Board
        number: 0x00
      - name: INJECTOR
        desc: Injector Board
        number: 0x01
      - name: CAMERA
        desc: Flight Camera Board
        number: 0x02
      - name: POWER
        desc: Power Board
        number: 0x03
        doc-link: /avionics/rocket-power-board/index
      - name: LOGGER
        desc: CAN Logger Board
        number: 0x04
        doc-link: /avionics/camera-logger-board/index
      - name: CANARD
        desc: Canard Board
        number: 0x05
        doc-link: /controls/canards-electrical/index
      - name: TELEMETRY
        desc: Live Telemetry Board
        number: 0x06
        doc-link: /avionics/live-telemetry/index
      - name: GPS
        desc: COTS GPS Receiver Board
        number: 0x07
        doc-link: /avionics/gps-board/index
      - name: ALTIMETER
        desc: SRAD Altimeter
        number: 0x08
        doc-link: /avionics/srad-altimeter/index
      - name: ARMING
        desc: Remote Arming Board
        number: 0x09
        doc-link: /avionics/remote-arming/index
      - name: PAYLOAD
        desc: Payload Board
        number: 0x0A
      - name: RLCS_GLS
        desc: RLCS v4 Ground Launch Sequencer
        number: 0x0B
        doc-link: /electrical-gse/rlcs-v4/gls-board/index
      - name: RLCS_RELAY
        desc: RLCS v4 Relay Board
        number: 0x0C
        doc-link: /electrical-gse/rlcs-v4/relay-board/index
      - name: DAQ
        desc: DAQ(Data Acquisition System) CAN Support
        number: 0x0D
        doc-link: /electrical-gse/daq/index
      - name: THERMOCOUPLE
        desc: Thermocouple board
        number: 0x0E

  - name: board_inst
    desc: Board instance ID for CAN SID
    prefix: BOARD_INST_ID
    value:
      - name: ANY
        desc: Any instance of the board
        number: 0x00
      - name: GROUND
        desc: Board on the ground 
        number: 0x01
      - name: ROCKET
        desc: Board on the rocket 
        number: 0x02

      - name: CAMERA_SIDE_LOOKING
        desc: Side Looking Camera
        number: 0x03
      - name: CAMERA_DOWN_LOOKING
        desc: Down Looking Camera
        number: 0x04
      - name: CAMERA_RECOVERY
        desc: Recovery Looking Camera
        number: 0x05

      - name: TELEMETRY_GROUND_1
        desc: Ground side LTT 1
        number: 0x06
      - name: TELEMETRY_GROUND_2
        desc: Ground side LTT 2
        number: 0x07
      - name: TELEMETRY_GROUND_3
        desc: Ground side LTT 3
        number: 0x08
      - name: TELEMETRY_GROUND_4
        desc: Ground side LTT 4
        number: 0x09

      - name: ARMING_RA_RAVEN
        desc: Remote Arming for Raven
        number: 0x0A
      - name: ARMING_RA_STRATOLOGGER
        desc: Remote Arming for Stratologger
        number: 0x0B
        
      - name: TCB_1
        desc: TCB 1
        number: 0x0C
      - name: TCB_2
        desc: TCB 2
        number: 0x0D
      - name: TCB_3
        desc: TCB 3
        number: 0x0E
      - name: TCB_4
        desc: TCB 4
        number: 0x0F

  - name: actuator_id
    desc: Actuator ID for Actuator Command and Status Messages
    prefix: ACTUATOR
    value:
      - name: OX_INJECTOR_VALVE
        desc: Oxidizer Injector Valve, for hall-effect sensor state feedback and Canard activation
        number: 0x00
      - name: FUEL_INJECTOR_VALVE
        desc: Oxidizer Injector Valve, for hall-effect sensor state feedback
        number: 0x01
      - name: IGNITION
        desc: Ignition Puck
        number: 0x02
      - name: ROCKET_UPPER_CHARGE_ENABLE
        desc: Rocket Upper Section Ground-side Charging Enable
        number: 0x03
      - name: ROCKET_INJECTOR_CHARGE_ENABLE
        desc: Rocket Injector Section Ground-side Charging Enable
        number: 0x04
      - name: 5V_RAIL_ROCKET
        desc: ""
        number: 0x05
      - name: 12V_RAIL_ROCKET
        desc: ""
        number: 0x06
      - name: TELEMETRY
        desc: ""
        number: 0x07
      - name: CAMERA_SIDE_LOOKING_POWER
        desc: ""
        number: 0x08
      - name: CAMERA_DOWN_LOOKING_POWER
        desc: ""
        number: 0x09
      - name: CAMERA_RECOVERY_POWER
        desc: ""
        number: 0x0A
      - name: CAMERA_SIDE_LOOKING_RECORD
        desc: ""
        number: 0x0B
      - name: CAMERA_DOWN_LOOKING_RECORD
        desc: ""
        number: 0x0C
      - name: CAMERA_RECOVERY_RECORD
        desc: ""
        number: 0x0D
      - name: CANARD_PAD_FILTER
        desc: Switch Canard to Pad Filter when commanded ACT_STATE_ON
        number: 0x0E
      - name: CANARD_5V_OUTPUT
        desc: Enable Canard Board's 5V output to payload
        number: 0x0F
      - name: CANARD_LIPO_ON
        desc: Enable Canard board draw power from LiPo
        number: 0x10
      - name: SRAD_ALT_ESTIMATOR_INIT
        desc: Actuator command to start SRAD Altimeter state estimation
        number: 0x11
      - name: SRAD_ALT_GPS_RESET
        desc: Actuator command to reset GPS Receiver on SRAD Altimeter
        number: 0x12
      - name: CAMERA_CAPTURE
        desc: ""
        number: 0x13
      - name: PAYLOAD_LOGGING_ENABLE
        desc: Payload Sensor Board Logging Enable Control
        number: 0x14
      - name: INJECTOR_BOARD_ACTUATOR_1
        desc: Injector board actuator channel 1
        number: 0x15
      - name: INJECTOR_BOARD_ACTUATOR_2
        desc: Injector board actuator channel 2
        number: 0x16
      - name: RLCS_RELAY_POWER
        desc: RLCS Relay Board Power Relay
        number: 0x17
      - name: RLCS_RELAY_SELECT
        desc: RLCS Relay Board Select Relay(Limit switch state feedback)
        number: 0x18
      - name: PAYLOAD_ACCEL_ARM
        desc: Payload accelerometer arming
        number: 0x19
      - name: PAYLOAD_PZT_ARM
        desc: Payload PZT phase biasing arming
        number: 0x1A
      - name: LOGGER_FLASH_ERASE
        desc: Erase logger board flash
        number: 0x1B
      - name: CANARD_FLASH_ERASE
        desc: Erase canard board flash
        number: 0x1C
      - name: CANARD_MOTOR_CALIBRATION
        desc: Start canard motor calibration routine
        number: 0x1D
      - name: LOGGER_SD_CLEAR
        desc: Clear logger board SD card
        number: 0x1E
      - name: CANARD_SD_CLEAR
        desc: Clear canard board SD card
        number: 0x1F
      - name: PAYLOAD_SD_CLEAR
        desc: Clear payload board SD card
        number: 0x20

  - name: actuator_state
    desc: Actuator State
    prefix: ACT_STATE
    value:
      - name: ON
        desc: Actuator is in ON state, or Open
        number: 0x00
      - name: OFF
        desc: Actuator is in OFF state, or Close
        number: 0x01
      - name: UNK
        desc: Unknown state, for example when ball valve is turning
        number: 0x02
      - name: ILLEGAL
        desc: Illegal state, for example when limit switch of both state being triggered
        number: 0x03

  - name: altimeter_id
    desc: Altimeter ID for uniquely indentify each altimeter
    prefix: ALTIMETER
    value:
      - name: RAVEN
        desc: Raven4 Altimeter
        number: 0x00
      - name: STRATOLOGGER
        desc: StratoLoggerCF
        number: 0x01
      - name: SRAD
        desc: SRAD Altimeter
        number: 0x02

  - name: alt_arm_state
    desc: Altimiter Arm State
    prefix: ALT_ARM_STATE
    value:
      - name: DISARMED
        desc: Disarmed
        number: 0x00
      - name: ARMED
        desc: Armed
        number: 0x01

  - name: analog_sensor_id
    desc: Sensor ID for Sensor Messages
    prefix: SENSOR
    value:
      - name: 5V_VOLT
        desc: Voltage of 5V rail in mV
        number: 0x00
      - name: 5V_CURR
        desc: Current of 5V rail in mA
        number: 0x01
      - name: 12V_VOLT
        desc: Voltage of 12V rail in mV
        number: 0x02
      - name: 12V_CURR
        desc: Current of 12V rail in mA
        number: 0x03
      - name: CHARGE_VOLT
        desc: LiPo charging voltage in mV
        number: 0x04
      - name: CHARGE_CURR
        desc: LiPo charging current in mA  
        number: 0x05
      - name: BATT_VOLT
        desc: Battery Voltage in mV
        number: 0x06
      - name: ALTERNATE_BATT_VOLT
        desc: Secondary Battery Voltage in mV
        number: 0x07
      - name: BATT_CURR
        desc: Battery Current in mA
        number: 0x08
      - name: RADIO_CURR
        desc: Radio current in mA
        number: 0x09
      - name: GPS_CURR
        desc: GPS Receiver current in mA
        number: 0x0A
      - name: CAMERA_CURR
        desc: Camera current in mA
        number: 0x0B
      - name: LOCAL_RAIL_CURR
        desc: Local power rail (e.g. 3.3V) current in mA
        number: 0x0C
      - name: PT_CHANNEL_1
        desc: Pressure Transducer Channel 1
        number: 0x0D
      - name: PT_CHANNEL_2
        desc: Pressure Transducer Channel 2
        number: 0x0E
      - name: PT_CHANNEL_3
        desc: Pressure Transducer Channel 3
        number: 0x0F
      - name: PT_CHANNEL_4
        desc: Pressure Transducer Channel 4
        number: 0x10
      - name: PT_CHANNEL_5
        desc: Pressure Transducer Channel 5
        number: 0x11
      - name: PT_CHANNEL_6
        desc: Pressure Transducer Channel 6
        number: 0x12
      - name: PT_CHANNEL_7
        desc: Pressure Transducer Channel 7
        number: 0x13
      - name: PT_CHANNEL_8
        desc: Pressure Transducer Channel 8
        number: 0x14
      - name: PT_CHANNEL_9
        desc: Pressure Transducer Channel 9
        number: 0x15
      - name: PT_CHANNEL_10
        desc: Pressure Transducer Channel 10
        number: 0x16
      - name: HALL_CHANNEL_1
        desc: Hall-Effect Sensor Channel 1
        number: 0x17
      - name: HALL_CHANNEL_2
        desc: Hall-Effect Sensor Channel 2
        number: 0x18
      - name: HALL_CHANNEL_3
        desc: Hall-Effect Sensor Channel 3
        number: 0x19
      - name: RA_BATT_VOLT_1
        desc: ""
        number: 0x1A
      - name: RA_BATT_VOLT_2
        desc: ""
        number: 0x1B
      - name: RA_BATT_CURR_1
        desc: ""
        number: 0x1C
      - name: RA_BATT_CURR_2
        desc: ""
        number: 0x1D
      - name: RA_MAG_VOLT_1
        desc: ""
        number: 0x1E
      - name: RA_MAG_VOLT_2
        desc: ""
        number: 0x1F
      - name: FPS
        desc: Camera framerate
        number: 0x20
      - name: PAYLOAD_LIM_1
        desc: Payload Motor Board Limit Switch 1
        number: 0x21
      - name: PAYLOAD_LIM_2
        desc: Payload Motor Board Limit Switch 2
        number: 0x22
      - name: PAYLOAD_SERVO_DIRECTION
        desc: Payload Servo Direction
        number: 0x23
      - name: PAYLOAD_INFRARED
        desc: Payload Infrared Sensor Reading
        number: 0x24
      - name: INJECTOR_BOARD_TEMP_1
        desc: Injector board temperature channel 1
