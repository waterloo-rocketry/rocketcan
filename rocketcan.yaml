  - name: board_error_bitfield
    desc: Board error bitfield
    prefix: E
    bits:
      - name: 5V_OVER_CURR
        desc: ""
        bit: 0
      - name: 5V_OVER_VOLT
        desc: ""
        bit: 1
      - name: 5V_UNDER_VOLT
        desc: ""
        bit: 2
      - name: 12V_OVER_CURR
        desc: ""
        bit: 3
      - name: 12V_OVER_VOLT
        desc: ""
        bit: 4
      - name: 12V_UNDER_VOLT
        desc: ""
        bit: 5
      - name: BATT_OVER_CURR
        desc: ""
        bit: 6
      - name: BATT_OVER_VOLT
        desc: ""
        bit: 7
      - name: BATT_UNDER_VOLT
        desc: ""
        bit: 8
      - name: MOTOR_OVER_CURR
        desc: ""
        bit: 9
      - name: IO_ERROR
        desc: ""
        bit: 10
      - name: FS_ERROR
        desc: ""
        bit: 11
      - name: WATCHDOG_TIMEOUT
        desc: ""
        bit: 12
      - name: 12V_EFUSE_FAULT
        desc: ""
        bit: 13
      - name: 5V_EFUSE_FAULT
        desc: ""
        bit: 14
      - name: PT_OUT_OF_RANGE
        desc: ""
        bit: 15
      - name: CANARD_MODULE_FAILURE
        desc: Canard firmware application module error
        bit: 16
      - name: LOCAL_RAIL_OVER_CURR
        desc: Local power rail (e.g. 3.3V) over current
        bit: 17
      - name: CHARGE_RAIL_OVER_VOLT
        desc: Charge power rail over voltage
        bit: 18
      - name: CHARGE_RAIL_OVER_CURR
        desc: Charge power rail over current
        bit: 19

  - name: canards_module_error_bitfield
    desc: Canards module_error bitfield
    prefix: CANARDS_MODULE_E
    bits:
      - name: BAT1_FAULT
        desc: Battery 1 fault
        bit: 0
      - name: BAT2_FAULT
        desc: Battery 2 fault
        bit: 1
      - name: DEVICE_FAULT
        desc: External device fault
        bit: 2
      - name: FILE_SYSTEM
        desc: SD card or flash storage mount, read, or write operation failed
        bit: 3
      - name: HARDWARE_FAIL
        desc: Hardware interface failed (GPIO, pin config, etc.)
        bit: 4
      - name: LOW_POWER_MODE_WITH_EXT_5V_ON
        desc: Low-power mode active while external 5V is on
        bit: 5
      - name: COMM_FAILURE
        desc: Communication protocol failure (I2C, SPI, UART, etc.)
        bit: 6
      - name: CRC_FAILED
        desc: Integrity check failed
        bit: 7
      - name: NO_DATA
        desc: Expected sensor data packet or control command frame is missing
        bit: 8
      - name: RX_FAILURE
        desc: Error occurred during data reception on physical bus transceivers
        bit: 9
      - name: TIMEOUT
        desc: Operation or sensor handshake exceeded its allocated time window
        bit: 10
      - name: TX_FAILURE
        desc: Transmit failure
        bit: 11
      - name: ERROR_STATE
        desc: FSM transitioned into an unhandled, invalid, or corrupted state
        bit: 12
      - name: FAILED_CALIBRATION
        desc: Calibration routine executed but failed
        bit: 13
      - name: NOT_CALIBRATED
        desc: Calibration did not execute
        bit: 14
      - name: LOOP_TIMING
        desc: Control loop period did not meet timing requirements
        bit: 15
      - name: NOT_INIT
        desc: Module, task, or driver was accessed before being initialized
        bit: 16
      - name: OS
        desc: RTOS feature (queue, semaphore) failed
        bit: 17
      - name: CODEGEN
        desc: Error occurred inside codegen
        bit: 18
      - name: UNEXPECTED_EVENT
        desc: Attempted to trigger an illegal state transition event
        bit: 19
      - name: INVALID_PARAM
        desc: Function argument passed with value outside of legal range
        bit: 20
      - name: MATH
        desc: Floating-point exception, division by zero, or NaN in control algorithms
        bit: 21
      - name: OUT_OF_BOUNDS
        desc: Data is out of range
        bit: 22
      - name: OVERFLOW
        desc: Buffer, queue, or integer arithmetic register overflow
        bit: 23
      - name: INTERNAL
        desc: General software assertion or unhandled catch-all logical exception
        bit: 24
